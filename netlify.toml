[build]
  publish = "."

# ── security headers ─────────────────────────────────────────────────
# The site is a single self-contained page: no external scripts, styles,
# fonts, or frames. Styles and behaviour live in one inline <style> and
# one inline <script>, so style-src/script-src need 'unsafe-inline' —
# everything else is locked to 'self'. img-src allows data: for the
# inline SVG favicon and the base64 logo.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── caching ──────────────────────────────────────────────────────────
# Netlify defaults to max-age=0, must-revalidate. The page itself is
# edited in place so it must revalidate, but the image assets change
# filename when they change.

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
